apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: login-app
  template:
    metadata:
      labels:
        app: login-app
    spec:
      containers:
      - name: login-app
        image: devopslab2026bse/devops-login-app:v1
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: login-app-service
spec:
  type: NodePort
  selector:
    app: login-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
